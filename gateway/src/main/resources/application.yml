server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          # 업스트림 커넥션 풀 (phase-8 #8 P1). 기본 ELASTIC 은 동시 요청 수만큼 새 연결을 열어 스파이크 때
          # 서비스 Tomcat accept 큐(backlog)가 넘쳐 연결 리셋이 났다. FIXED 로 서비스(호스트)당 연결 수를 묶고
          # 초과 요청은 게이트웨이에서 대기시킨다 (대기 큐 무제한, acquire-timeout 초과 시 오류)
          httpclient:
            pool:
              type: FIXED
              max-connections: ${GATEWAY_POOL_MAX_CONNECTIONS:200}     # 서비스 Tomcat 스레드 수(기본 200)와 맞춤
              acquire-timeout: ${GATEWAY_POOL_ACQUIRE_TIMEOUT_MS:30000}
              max-idle-time: 30s                                       # Tomcat keep-alive 타임아웃(60s)보다 짧게 → 닫힌 연결 재사용 방지
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: queue-service
              uri: ${QUEUE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/queue/**
            - id: coupon-service
              uri: ${COUPON_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/coupons/**
            - id: entry-service
              uri: ${ENTRY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/entries/**
            - id: ranking-service
              uri: ${RANKING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/rankings/**

queuedrop:
  jwt:
    secret: ${JWT_SECRET:queue-drop-local-development-secret-key-0123456789}   # user-service 와 동일해야 함
    issuer: queue-drop
  auth:
    public-paths:
      - POST /api/users/signup
      - POST /api/users/login
      - GET /api/products/drops
      - GET /api/products/drops/{dropId}
      - GET /api/rankings/drops
      - GET /api/rankings/users/weekly
      - GET /api/rankings/users/all
      - GET /api/coupons/events/{eventId}
      - GET /api/entries/drops/{dropId}/result
      - GET /actuator/health      # gateway 자신의 actuator 는 라우팅되지 않아 필터를 거치지 않는다. 다운스트림 health 를 경유 노출할 때를 대비한 항목

# Actuator · 메트릭 (phase-8 3.2)
management:
  endpoints:
    web:
      exposure:
        include: health     # 외부 공개 포트라 metrics·prometheus 비노출 (phase-8 3.2)
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
