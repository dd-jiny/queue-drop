server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/users/**
            - id: product-service
              uri: ${PRODUCT_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/products/**
            - id: queue-service
              uri: ${QUEUE_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/queue/**
            - id: coupon-service
              uri: ${COUPON_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/coupons/**
            - id: entry-service
              uri: ${ENTRY_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/entries/**
            - id: ranking-service
              uri: ${RANKING_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/rankings/**

queuedrop:
  jwt:
    secret: ${JWT_SECRET:queue-drop-local-development-secret-key-0123456789}   # user-service 와 동일해야 함
    issuer: queue-drop
  auth:
    public-paths:
      - POST /api/users/signup
      - POST /api/users/login
      - GET /api/products/drops
      - GET /api/products/drops/{dropId}
      - GET /api/rankings/drops
      - GET /api/rankings/users/weekly
      - GET /api/rankings/users/all
      - GET /api/coupons/events/{eventId}
      - GET /api/entries/drops/{dropId}/result
      - GET /actuator/health
