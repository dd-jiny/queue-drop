# 시연 페이지 서빙 + /api 를 gateway 로 프록시 (같은 출처라 CORS 불필요)
# 사용: docker compose --profile demo up -d demo → http://localhost:8000
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 시연 중 파일을 고치면 바로 반영되도록 캐시하지 않는다
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # gateway 가 아직 안 떠 있어도 nginx 가 기동되도록 이름을 요청 시점에 해석한다 (Docker 내장 DNS)
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway_upstream gateway:8080;

    location /api/ {
        proxy_pass http://$gateway_upstream;     # URI 없이 변수만 쓰면 원래 경로(/api/...)를 그대로 넘긴다
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 오류 응답 본문(JSON)을 그대로 전달한다
        proxy_intercept_errors off;
        # 폴링·발급 대기(최대 수 초)를 고려해 넉넉히 둔다
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
