server:
  port: 8084

spring:
  application:
    name: coupon-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/coupon_db
    username: ${DB_USERNAME:queuedrop}
    password: ${DB_PASSWORD:queuedrop}
  jpa:
    hibernate:
      ddl-auto: validate        # 스키마는 Flyway 가 만든다. 엔티티와 불일치 시 기동 실패
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 1s                # 명령 타임아웃 (Lettuce 기본 60초). 발급 응답 경로가 Redis 장애에 오래 묶이지 않게
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer   # Spring Kafka 4 (Jackson 3)
      acks: all
      retries: 2147483647          # 횟수가 아니라 delivery.timeout.ms 로 전체 시간을 제한
      properties:
        enable.idempotence: true
        request.timeout.ms: 1000
        delivery.timeout.ms: 3000
        max.block.ms: 1000         # send() 호출 자체의 블로킹 상한 (기본 60초)
        linger.ms: 0               # Kafka 4.0 클라이언트 기본값 5ms. 응답 경로에 배치 대기를 넣지 않는다
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      enable-auto-commit: false    # 처리 성공 후 컨테이너가 커밋 (ack-mode record)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
        spring.json.trusted.packages: com.queuedrop.common.event
    listener:
      ack-mode: record             # 레코드 단위로 처리 성공 후 커밋
      concurrency: 3               # coupon.issued 파티션 6 → 인스턴스 2개 기준 3씩 (entry 와 같음)

coupon:
  publish:
    await-timeout: 3500ms          # delivery.timeout.ms(3000) + 여유
