# 8단계 app 프로필 공통 설정 (phase-8 3.3). 앵커는 참조보다 먼저 정의돼야 하므로 최상위에 둔다
# - docker compose up -d                       → 인프라만 (기존 개발 방식)
# - docker compose --profile app up -d --build → 인프라 + 서비스 7개 (사전에 ./gradlew clean bootJar)
x-app-common: &app-common
  build:
    context: .
    dockerfile: docker/service.Dockerfile
  profiles: ["app"]
  restart: unless-stopped
  deploy:
    resources:
      limits:
        memory: 768m        # 측정 환경에 맞게 조정 (리포트에 기록)
  healthcheck: &app-healthcheck   # 서비스별 healthcheck 는 이 앵커를 병합해 test 만 더한다 (<< 는 얕은 병합)
    interval: 5s
    timeout: 3s
    retries: 30

x-db-env: &db-env
  DB_HOST: postgres
  DB_PORT: 5432
  DB_USERNAME: queuedrop
  DB_PASSWORD: queuedrop

x-redis-env: &redis-env
  REDIS_HOST: redis
  REDIS_PORT: 6379

x-kafka-env: &kafka-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092     # 컨테이너 간에는 INTERNAL 리스너

x-infra-deps: &infra-deps
  postgres: { condition: service_healthy }
  redis: { condition: service_healthy }
  kafka: { condition: service_healthy }
  kafka-init: { condition: service_completed_successfully }   # 토픽 생성 완료 후 기동

services:
  postgres:
    image: postgres:17
    container_name: queuedrop-postgres
    environment:
      POSTGRES_USER: queuedrop
      POSTGRES_PASSWORD: queuedrop
      POSTGRES_DB: queuedrop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuedrop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7.4
    container_name: queuedrop-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.0.0
    container_name: queuedrop-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 10

  kafka-init:
    image: apache/kafka:4.0.0
    container_name: queuedrop-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./infra/kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: queuedrop-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: queue-drop
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  # ---- 애플리케이션 서비스 (app 프로필). 외부 노출은 gateway 만 ----
  gateway:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: gateway } }
    container_name: queuedrop-gateway
    ports:
      - "8080:8080"                         # 외부에 노출되는 유일한 애플리케이션 포트
    deploy:                                 # (phase-8 #8 P2) 클라이언트 연결을 모두 받는 Netty 라 다이렉트 메모리를 따로 잡는다
      resources:
        limits:
          memory: 1024m
    environment:
      JAVA_OPTS: "-XX:MaxRAMPercentage=50 -XX:MaxDirectMemorySize=256m -XX:+UseG1GC"   # 힙 512m + 다이렉트 256m + 그 외
      GATEWAY_POOL_MAX_CONNECTIONS: ${GATEWAY_POOL_MAX_CONNECTIONS:-200}   # 서비스(호스트)당 업스트림 연결 상한 (S3 비교 실험)
      JWT_SECRET: ${JWT_SECRET:-}   # 필수. ":?" 는 프로필 무관하게 보간돼 인프라만 띄울 때도 실패하므로 쓰지 않는다. 비면 기동 시 WeakKeyException
      USER_SERVICE_URL: http://user-service:8081
      PRODUCT_SERVICE_URL: http://product-service:8082
      QUEUE_SERVICE_URL: http://queue-service:8083
      COUPON_SERVICE_URL: http://coupon-service:8084
      ENTRY_SERVICE_URL: http://entry-service:8085
      RANKING_SERVICE_URL: http://ranking-service:8086
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8080/actuator/health"]
    depends_on:
      user-service: { condition: service_healthy }
      product-service: { condition: service_healthy }
      queue-service: { condition: service_healthy }
      entry-service: { condition: service_healthy }
      coupon-service: { condition: service_healthy }
      ranking-service: { condition: service_healthy }

  user-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: user-service } }
    container_name: queuedrop-user
    # ports 없음: 내부 네트워크에서만 접근
    environment:
      <<: [*db-env, *kafka-env]
      JWT_SECRET: ${JWT_SECRET:-}   # 필수. ":?" 는 프로필 무관하게 보간돼 인프라만 띄울 때도 실패하므로 쓰지 않는다. 비면 기동 시 WeakKeyException
      QUEUEDROP_JWT_ACCESS_TOKEN_TTL: ${QUEUEDROP_JWT_ACCESS_TOKEN_TTL:-2h}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@queuedrop.test}         # 1단계 관리자 계정 초기화 (확정)
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin!2345}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8081/actuator/health"]
    depends_on: *infra-deps

  product-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: product-service } }
    container_name: queuedrop-product
    environment:
      <<: [*db-env, *kafka-env]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8082/actuator/health"]
    depends_on: *infra-deps

  queue-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: queue-service } }
    container_name: queuedrop-queue
    environment:
      <<: [*redis-env, *kafka-env]
      QUEUE_ADMISSION_BATCH_SIZE: ${QUEUE_ADMISSION_BATCH_SIZE:-100}
      QUEUE_ADMISSION_INTERVAL_MS: ${QUEUE_ADMISSION_INTERVAL_MS:-1000}
      QUEUE_ADMISSION_TOKEN_TTL_SECONDS: ${QUEUE_ADMISSION_TOKEN_TTL_SECONDS:-300}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8083/actuator/health"]
    depends_on: *infra-deps

  coupon-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: coupon-service } }
    container_name: queuedrop-coupon
    environment:
      <<: [*db-env, *redis-env, *kafka-env]
      COUPON_PUBLISH_AWAIT_TIMEOUT: ${COUPON_PUBLISH_AWAIT_TIMEOUT:-3500ms}
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${COUPON_LISTENER_CONCURRENCY:-3}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8084/actuator/health"]
    depends_on: *infra-deps

  entry-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: entry-service } }
    container_name: queuedrop-entry
    environment:
      <<: [*db-env, *redis-env, *kafka-env]
      ENTRY_PUBLISH_AWAIT_TIMEOUT: ${ENTRY_PUBLISH_AWAIT_TIMEOUT:-3500ms}
      ENTRY_DRAW_INTERVAL_MS: ${ENTRY_DRAW_INTERVAL_MS:-5000}
      SPRING_KAFKA_LISTENER_CONCURRENCY: ${ENTRY_LISTENER_CONCURRENCY:-3}
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]
    depends_on: *infra-deps

  ranking-service:
    <<: *app-common
    build: { context: ., dockerfile: docker/service.Dockerfile, args: { MODULE: ranking-service } }
    container_name: queuedrop-ranking
    environment:
      <<: [*redis-env, *kafka-env]
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD", "curl", "-fs", "http://localhost:8086/actuator/health"]
    depends_on:
      redis: { condition: service_healthy }
      kafka: { condition: service_healthy }
      kafka-init: { condition: service_completed_successfully }

  # 부하 발생기 (phase-8 3.4). 사용: docker compose --profile loadtest run --rm k6 run [-e K=V ...] /scripts/<script>.js
  # app 프로필 서비스가 먼저 떠 있어야 한다 (scripts/loadtest-up.sh). depends_on 은 두지 않는다 (run 마다 app 을 재기동하지 않게)
  k6:
    image: grafana/k6:2.4.0                  # 2026-11-17 기준 최신 안정 태그 (스크립트는 로컬 k6 v2.3.0 에서도 동작 확인)
    profiles: ["loadtest"]
    # 이미지 기본 사용자는 k6(uid 12345). macOS Docker Desktop 은 바인드 마운트에 그대로 쓸 수 있지만,
    # Linux 에서 /results 쓰기가 막히면 K6_USER="$(id -u):$(id -g)" 로 호스트 사용자를 지정한다
    user: "${K6_USER:-12345:12345}"
    environment:
      BASE_URL: http://gateway:8080
      RESULTS_DIR: /results
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@queuedrop.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin!2345}
    volumes:
      - ./load-test:/scripts:ro
      - ./docs/report/results:/results         # handleSummary 결과 JSON

  # 시연 페이지 (선택). 사용: docker compose --profile demo up -d demo → http://localhost:8000
  # 정적 페이지(./demo)를 서빙하고 /api 는 gateway 로 프록시한다. app 프로필 서비스가 떠 있어야 API 가 동작한다
  # depends_on 은 두지 않는다 (app 프로필과 독립 실행 — gateway 이름은 요청 시점에 해석)
  demo:
    image: nginx:1.27-alpine
    container_name: queuedrop-demo
    profiles: ["demo"]
    ports:
      - "8000:80"
    volumes:
      - ./demo:/usr/share/nginx/html:ro
      - ./infra/demo/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # 모니터링 (phase-8 3.3, 선택). 사용: docker compose --profile monitoring up -d → Grafana http://localhost:3000 (익명 Viewer)
  # app 프로필 서비스를 scrape 한다 (gateway 제외). 측정에 쓰는 자원이 같은 호스트를 공유하므로 보고서 환경에 기록한다
  prometheus:
    image: prom/prometheus:v3.15.1
    container_name: queuedrop-prometheus
    profiles: ["monitoring"]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:13.2.6
    container_name: queuedrop-grafana
    profiles: ["monitoring"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/queue-drop.json
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on: [prometheus]

volumes:
  postgres-data:
  redis-data:
  prometheus-data:
