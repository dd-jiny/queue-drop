plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

ext {
    set('springCloudVersion', '2025.1.4')
    set('archunitVersion', '1.5.1')
}

allprojects {
    group = 'com.queuedrop'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// common · e2e-test 를 제외한 모든 모듈은 실행 가능한 Spring Boot 애플리케이션
// (e2e-test 는 HTTP 로만 검증하는 테스트 전용 모듈 — phase-5 3.6)
configure(subprojects.findAll { !(it.name in ['common', 'e2e-test']) }) {
    apply plugin: 'org.springframework.boot'

    dependencies {
        implementation 'org.springframework.boot:spring-boot-starter-actuator'
        testImplementation 'org.springframework.boot:spring-boot-starter-test'
    }

    jar { enabled = false }   // -plain.jar 생성 안 함 → build/libs 에 실행 jar 1개 (phase-8 3.1)
}

// 4계층 서비스: 공통 계층 규칙(ArchUnit)과 Testcontainers 지원을 test fixtures 로 공유
def layeredServices = ['user-service', 'product-service', 'queue-service',
                       'entry-service', 'coupon-service', 'ranking-service']

configure(subprojects.findAll { it.name in layeredServices }) {
    dependencies {
        testImplementation testFixtures(project(':common'))
    }
}
